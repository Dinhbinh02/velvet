<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Velvet - Ebook Reader</title>
  <meta name="description" content="A smooth, luxury Ebook reader and library web application." />
  <meta name="referrer" content="no-referrer" />

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#F2F2F2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Velvet" />
  <meta name="application-name" content="Velvet" />
  <meta name="msapplication-TileColor" content="#F2F2F2" />

  <!-- Icons & Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
  <link rel="stylesheet" href="/src/styles/themes.css" />
</head>

<body
  class="w-screen h-screen overflow-hidden bg-[var(--bg-primary)] text-[var(--text-primary)] velvet-transition m-0 p-0 select-none">
  <div id="root" class="w-full h-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
